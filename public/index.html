<script>

const firebaseConfig = {

  projectId: "weight-tracker-2-f4946",
  storageBucket: "weight-tracker-2-f4946.firebasestorage.app",
  messagingSenderId: "885076681561",
  appId: "1:885076681561:web:97495e632690fe7052e248"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ==================== FIRESTORE HELPERS ====================
window.FS = {
  // Auth - simple username/password in Firestore
  async login(username, password) {
    const doc = await db.collection('users').doc(username.toLowerCase().trim()).get();
    if (!doc.exists) return { error: 'User not found. Sign up first.' };
    if (doc.data().password !== password) return { error: 'Wrong password.' };
    return { uid: doc.id, ...doc.data() };
  },
  async signup(username, password, name) {
    const uid = username.toLowerCase().trim();
    if (!uid || uid.length < 3) return { error: 'Username must be at least 3 characters.' };
    if (!password || password.length < 4) return { error: 'Password must be at least 4 characters.' };
    const doc = await db.collection('users').doc(uid).get();
    if (doc.exists) return { error: 'Username already taken.' };
    await db.collection('users').doc(uid).set({ password, name: name || uid, createdAt: new Date().toISOString() });
    return { uid, name: name || uid };
  },

  async getProfile(uid) {
    const doc = await db.collection('users').doc(uid).get();
    return doc.exists ? doc.data() : null;
  },
  async saveProfile(uid, profile) {
    await db.collection('users').doc(uid).set(profile, { merge: true });
  },
  async getMeals(uid, date) {
    const doc = await db.collection('users').doc(uid).collection('meals').doc(date).get();
    return doc.exists ? doc.data().meals || [] : [];
  },
  async saveMeals(uid, date, meals) {
    await db.collection('users').doc(uid).collection('meals').doc(date).set({ meals, updatedAt: new Date().toISOString() });
  },
  async getAllMeals(uid, limit = 60) {
    const snap = await db.collection('users').doc(uid).collection('meals').orderBy(firebase.firestore.FieldPath.documentId(), 'desc').limit(limit).get();
    const result = {};
    snap.forEach(doc => { result[doc.id] = doc.data().meals || []; });
    return result;
  },
  async getWeights(uid) {
    const doc = await db.collection('users').doc(uid).collection('data').doc('weights').get();
    return doc.exists ? doc.data().entries || {} : {};
  },
  async saveWeight(uid, date, weight) {
    await db.collection('users').doc(uid).collection('data').doc('weights').set(
      { [`entries.${date}`]: weight }, { merge: true }
    );
  },
  async saveWeights(uid, entries) {
    await db.collection('users').doc(uid).collection('data').doc('weights').set({ entries }, { merge: true });
  }
};
</script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

const todayStr = () => new Date().toISOString().split('T')[0];
const formatDate = (d) => new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});

function calcBMR(weight, height, age, gender) {
  const base = (10 * weight) + (6.25 * height) - (5 * age);
  return gender === 'female' ? base - 161 : base + 5;
}

const ACTIVITY_FACTORS = [
  { value: 1.2, label: 'Sedentary', desc: 'Little to no exercise, desk job' },
  { value: 1.375, label: 'Lightly Active', desc: 'Light exercise 1-3 days/week' },
  { value: 1.55, label: 'Moderately Active', desc: 'Moderate exercise 3-5 days/week' },
  { value: 1.725, label: 'Very Active', desc: 'Hard exercise 6-7 days/week' },
  { value: 1.9, label: 'Extremely Active', desc: 'Very heavy exercise, physical labor' },
];

function Toast({ message, type, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, []);
  const colors = { success: 'var(--green)', error: 'var(--red)', info: 'var(--primary-light)' };
  const icons = { success: 'check_circle', error: 'error', info: 'info' };
  return <div className="toast"><span className="material-icons-round" style={{color:colors[type],fontSize:20}}>{icons[type]}</span>{message}</div>;
}

// ==================== MAIN APP ====================
function App() {
  const [uid, setUid] = useState(() => localStorage.getItem('caltrack_uid'));
  const [profile, setProfile] = useState(null);
  const [meals, setMeals] = useState({});
  const [weights, setWeights] = useState({});
  const [page, setPage] = useState('dashboard');
  const [toast, setToast] = useState(null);
  const [foods, setFoods] = useState([]);
  const [loading, setLoading] = useState(true);

  const showToast = (message, type='success') => setToast({message,type});

  useEffect(() => {
    fetch('/indian-foods.json').then(r=>r.json()).then(setFoods).catch(()=>{});
    if (uid) { loadUserData(uid).then(()=>setLoading(false)); }
    else { setLoading(false); }
  }, []);

  const onLogin = async (loggedInUid) => {
    setUid(loggedInUid);
    localStorage.setItem('caltrack_uid', loggedInUid);
    await loadUserData(loggedInUid);
  };

  const loadUserData = async (u) => {
    try {
      const [p, w, m] = await Promise.all([
        FS.getProfile(u),
        FS.getWeights(u),
        FS.getAllMeals(u)
      ]);
      setProfile(p);
      setWeights(w || {});
      setMeals(m || {});
    } catch(e) { console.error('Load error:', e); }
  };

  const reloadMeals = async () => {
    if (!uid) return;
    const m = await FS.getAllMeals(uid);
    setMeals(m || {});
  };
  const reloadWeights = async () => {
    if (!uid) return;
    const w = await FS.getWeights(uid);
    setWeights(w || {});
  };
  const reloadProfile = async () => {
    if (!uid) return;
    const p = await FS.getProfile(uid);
    setProfile(p);
  };

  const logout = () => {
    localStorage.removeItem('caltrack_uid');
    setUid(null); setProfile(null); setMeals({}); setWeights({});
  };

  if (loading) {
    return <div className="login-page"><div className="spinner"></div><p style={{color:'var(--text3)',marginTop:16}}>Loading...</p></div>;
  }

  if (!uid) {
    return <><AuthPage showToast={showToast} onLogin={onLogin} />{toast && <Toast {...toast} onClose={()=>setToast(null)} />}</>;
  }

  if (!profile || !profile.height) {
    return <><SetupPage uid={uid} displayName={profile?.name||uid} onComplete={(savedProfile)=>{ setProfile(savedProfile); }} showToast={showToast} />{toast && <Toast {...toast} onClose={()=>setToast(null)} />}</>;
  }

  const user = { profile, meals, weights, name: profile.name || uid };

  const pages = {
    dashboard: <DashboardPage user={user} uid={uid} foods={foods} showToast={showToast} reloadMeals={reloadMeals} reloadWeights={reloadWeights} />,
    log: <LogMealPage user={user} uid={uid} foods={foods} showToast={showToast} setPage={setPage} reloadMeals={reloadMeals} />,
    weight: <WeightPage user={user} uid={uid} showToast={showToast} reloadWeights={reloadWeights} reloadProfile={reloadProfile} />,
    calendar: <CalendarPage user={user} uid={uid} foods={foods} showToast={showToast} />,
    settings: <SettingsPage user={user} uid={uid} showToast={showToast} onLogout={logout} reloadProfile={reloadProfile} />,
  };

  return <div>{pages[page]}<BottomNav page={page} setPage={setPage} />{toast && <Toast {...toast} onClose={()=>setToast(null)} />}</div>;
}

// ==================== AUTH PAGE ====================
function AuthPage({ showToast, onLogin }) {
  const [mode, setMode] = useState('login');
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [name, setName] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!username || !password) { setError('Fill all fields'); return; }
    setLoading(true); setError('');
    try {
      if (mode === 'login') {
        const res = await FS.login(username, password);
        if (res.error) { setError(res.error); setLoading(false); return; }
        await onLogin(res.uid);
      } else {
        const res = await FS.signup(username, password, name);
        if (res.error) { setError(res.error); setLoading(false); return; }
        await onLogin(res.uid);
      }
    } catch(e) {
      setError(e.message);
    }
    setLoading(false);
  };

  return (
    <div className="login-page">
      <img src="/icon-192.png" style={{width:80,height:80,borderRadius:20,marginBottom:16}} className="bounce-in float-anim" />
      <div className="login-logo bounce-in" style={{animationDelay:'0.1s'}}>CalTrack</div>
      <p style={{color:'var(--text3)',marginBottom:32,fontSize:14}} className="fade-in" style={{animationDelay:'0.2s'}}>Your AI-Powered Calorie Companion</p>
      <div className="login-card fade-in" style={{animationDelay:'0.2s'}}>
        <div className="auth-tabs">
          <button className={`auth-tab ${mode==='login'?'active':''}`} onClick={()=>{setMode('login');setError('');}}>Login</button>
          <button className={`auth-tab ${mode==='signup'?'active':''}`} onClick={()=>{setMode('signup');setError('');}}>Sign Up</button>
        </div>

        <form onSubmit={handleSubmit}>
          {mode === 'signup' && (
            <div className="input-group">
              <label>Display Name</label>
              <input value={name} onChange={e=>setName(e.target.value)} placeholder="Your name" />
            </div>
          )}
          <div className="input-group">
            <label>Username</label>
            <input value={username} onChange={e=>setUsername(e.target.value)} placeholder="e.g. rushil" autoCapitalize="none" autoCorrect="off" />
          </div>
          <div className="input-group">
            <label>Password</label>
            <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder={mode==='signup'?'Min 4 characters':'Your password'} />
          </div>
          {error && <p style={{color:'var(--red)',fontSize:13,marginBottom:12}}>{error}</p>}
          <button type="submit" className="btn btn-primary btn-full" disabled={loading}>
            {loading ? <><div className="spinner" style={{width:20,height:20,margin:0,borderWidth:2}}></div></> : mode==='login' ? 'Login' : 'Create Account'}
          </button>
        </form>
      </div>
    </div>
  );
}

// ==================== SETUP PAGE ====================

  const finish = async () => {
    if (!form.height || !form.weight || !form.age) { showToast('Fill all fields','error'); return; }
    const profile = {
      name: form.name || displayName || 'User',
      gender: form.gender,
      height: parseFloat(form.height),
      weight: parseFloat(form.weight),
      age: parseInt(form.age),
      activityFactor: parseFloat(form.activityFactor),
      targetLossPerWeek: parseFloat(form.targetLossPerWeek),
      startWeight: parseFloat(form.weight),
      startDate: todayStr(),
    };
    try {
      await FS.saveProfile(uid, profile);
      await FS.saveWeight(uid, todayStr(), parseFloat(form.weight));
      showToast('Profile setup complete!');
      await onComplete(profile);

      showToast('Error: ' + err.message, 'error');

  const steps = [
    <div key="0" className="fade-in">
      <h2 style={{marginBottom:8}}>Welcome, {form.name || 'there'}!</h2>

      <div className="input-group">
        <label>Your Name</label>
        <input value={form.name} onChange={e=>set('name',e.target.value)} placeholder="Name" />
      </div>
      <div className="input-group">
        <label>Gender</label>
        <div style={{display:'flex',gap:8}}>
          {['male','female'].map(g=>(
            <button key={g} className={`btn ${form.gender===g?'btn-primary':'btn-ghost'}`} style={{flex:1,textTransform:'capitalize'}} onClick={()=>set('gender',g)}>
              <span className="material-icons-round">{g==='male'?'male':'female'}</span>{g}

          ))}
        </div>
      </div>
      <div className="input-group">
        <label>Age</label>
        <input type="number" value={form.age} onChange={e=>set('age',e.target.value)} placeholder="Your age" />
      </div>
      <button className="btn btn-primary btn-full" onClick={()=>form.age?setStep(1):showToast('Enter your age','error')}>
        Next <span className="material-icons-round">arrow_forward</span>
      </button>
    </div>,
    <div key="1" className="fade-in">
      <h2 style={{marginBottom:24}}>Body Measurements</h2>
      <div className="input-group"><label>Height (cm)</label><input type="number" value={form.height} onChange={e=>set('height',e.target.value)} placeholder="e.g. 182" /></div>
      <div className="input-group"><label>Current Weight (kg)</label><input type="number" step="0.1" value={form.weight} onChange={e=>set('weight',e.target.value)} placeholder="e.g. 104" /></div>
      <div style={{display:'flex',gap:8}}>
        <button className="btn btn-ghost" style={{flex:1}} onClick={()=>setStep(0)}>Back</button>
        <button className="btn btn-primary" style={{flex:2}} onClick={()=>(form.height&&form.weight)?setStep(2):showToast('Fill all fields','error')}>Next <span className="material-icons-round">arrow_forward</span></button>
      </div>
    </div>,
    <div key="2" className="fade-in">
      <h2 style={{marginBottom:24}}>Activity & Goals</h2>
      <div className="input-group">
        <label>Activity Level <ActivityInfoBtn /></label>
        <select value={form.activityFactor} onChange={e=>set('activityFactor',e.target.value)}>
          {ACTIVITY_FACTORS.map(a=><option key={a.value} value={a.value}>{a.label} ({a.value})</option>)}
        </select>
      </div>
      <div className="input-group">
        <label>Weight Loss Target (kg/week)</label>
        <select value={form.targetLossPerWeek} onChange={e=>set('targetLossPerWeek',e.target.value)}>
          {[0.25,0.5,0.75,1,1.25,1.5,2,2.5,3].map(v=><option key={v} value={v}>{v} kg/week</option>)}

// ==================== DASHBOARD ====================
function DashboardPage({ user, uid, foods, showToast, reloadMeals, reloadWeights }) {
  const [showMealModal, setShowMealModal] = useState(null);
  const [refresh, setRefresh] = useState(0);
  const p = user.profile;
  const todayMeals = user.meals[todayStr()] || [];
  const currentWeight = getLatestWeight(user);

  const bmr = calcBMR(currentWeight, p.height, p.age, p.gender);
  const tdee = bmr * p.activityFactor;
  const dailyDeficit = (p.targetLossPerWeek * 7700) / 7;
  const budget = Math.round(tdee - dailyDeficit);

  const consumed = todayMeals.reduce((s,m) => s + m.items.reduce((a,i) => a+i.calories*i.qty, 0), 0);
  const remaining = budget - consumed;
  const pct = Math.min(consumed / budget, 1);

  const totalProtein = todayMeals.reduce((s,m) => s+m.items.reduce((a,i) => a+(i.protein||0)*i.qty, 0), 0);
  const totalCarbs = todayMeals.reduce((s,m) => s+m.items.reduce((a,i) => a+(i.carbs||0)*i.qty, 0), 0);
  const totalFat = todayMeals.reduce((s,m) => s+m.items.reduce((a,i) => a+(i.fat||0)*i.qty, 0), 0);

  const ringColor = remaining >= 0 ? 'var(--accent)' : 'var(--red)';
  const circumference = 2 * Math.PI * 85;
  const dashOffset = circumference * (1 - pct);

  return (
    <div className="container">
      <div className="header fade-in">
        <div><h1>CalTrack</h1><p style={{fontSize:12,color:'var(--text3)'}}>{formatDate(todayStr())}</p></div>
        <div className="header-right">
          <div className="avatar">{user.name[0].toUpperCase()}</div>
        </div>
      </div>

      <div className="card fade-in" style={{animationDelay:'0.1s'}}>
        <div className="calorie-ring-container">
          <div className="calorie-ring">
            <svg width="200" height="200" viewBox="0 0 200 200">
              <circle cx="100" cy="100" r="85" fill="none" stroke="var(--bg)" strokeWidth="12" />
              <circle cx="100" cy="100" r="85" fill="none" stroke={ringColor} strokeWidth="12"
                strokeDasharray={circumference} strokeDashoffset={dashOffset} strokeLinecap="round" style={{transition:'stroke-dashoffset 1.5s cubic-bezier(0.4,0,0.2,1)', animation:'ringDraw 1.5s ease forwards'}} />
            </svg>
            <div className="calorie-ring-text">
              <div className="remaining" style={{color:ringColor}}>{Math.round(remaining)}</div>
              <div className="label">calories left</div>
            </div>
          </div>
          <div className="macro-row">
            <div className="macro-pill scale-in" style={{animationDelay:'0.3s'}}><div className="value" style={{color:'var(--accent)'}}>{Math.round(consumed)}</div><div className="label">Eaten</div></div>
            <div className="macro-pill scale-in" style={{animationDelay:'0.4s'}}><div className="value" style={{color:'var(--primary-light)'}}>{budget}</div><div className="label">Budget</div></div>
            <div className="macro-pill scale-in" style={{animationDelay:'0.5s'}}><div className="value" style={{color:remaining>=0?'var(--green)':'var(--red)'}}>{Math.round(remaining)}</div><div className="label">Left</div></div>
          </div>
        </div>
      </div>

      <div className="card fade-in" style={{animationDelay:'0.2s'}}>
        <h3 style={{fontSize:14,color:'var(--text3)',marginBottom:12}}>Today's Macros</h3>
        <div className="macro-row">
          <div className="macro-pill scale-in" style={{animationDelay:'0.3s'}}><div className="value" style={{color:'#74b9ff'}}>{Math.round(totalProtein)}g</div><div className="label">Protein</div></div>
          <div className="macro-pill scale-in" style={{animationDelay:'0.4s'}}><div className="value" style={{color:'var(--orange)'}}>{Math.round(totalCarbs)}g</div><div className="label">Carbs</div></div>
          <div className="macro-pill scale-in" style={{animationDelay:'0.5s'}}><div className="value" style={{color:'var(--accent2)'}}>{Math.round(totalFat)}g</div><div className="label">Fat</div></div>
        </div>
      </div>

      <div className="fade-in" style={{animationDelay:'0.3s'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
          <h3 style={{fontSize:16,fontWeight:700}}>Today's Meals</h3>
          <span className="badge badge-green">{todayMeals.length} logged</span>
        </div>
        {todayMeals.map((meal,i) => (
          <div key={i} className="meal-card" onClick={()=>setShowMealModal({date:todayStr(),index:i})}>
            <div className="meal-card-header">
              <h3>{meal.label || `Meal ${i+1}`}</h3>
              <span style={{fontSize:15,fontWeight:700,color:'var(--accent)'}}>{meal.items.reduce((a,it)=>a+it.calories*it.qty,0)} cal</span>
            </div>
            <div className="meal-items">
              {meal.items.map((it,j)=><div key={j} className="meal-item-row"><span>{it.name} {it.qty>1?`x${it.qty}`:''}</span><span style={{color:'var(--text3)'}}>{it.calories*it.qty} cal</span></div>)}
            </div>
          </div>
        ))}
        {todayMeals.length === 0 && (
          <div className="fade-in" style={{textAlign:'center',padding:32,color:'var(--text3)'}}>
            <span className="material-icons-round float-anim" style={{fontSize:48,opacity:0.3,display:'inline-block'}}>restaurant</span>
            <p style={{marginTop:8}}>No meals logged yet today</p>
          </div>
        )}
      </div>

      <QuickWeightEntry user={user} uid={uid} showToast={showToast} reloadWeights={reloadWeights} />

      {showMealModal && <MealDetailModal user={user} uid={uid} date={showMealModal.date} mealIndex={showMealModal.index} foods={foods} showToast={showToast} onClose={()=>{setShowMealModal(null);reloadMeals();}} />}
    </div>
  );
}

function QuickWeightEntry({ user, uid, showToast, reloadWeights }) {
  const [weight, setWeight] = useState('');
  const todayWeight = user.weights && user.weights[todayStr()];
  if (todayWeight) return null;
  const save = async () => {
    if (!weight) return;
    await FS.saveWeight(uid, todayStr(), parseFloat(weight));
    await FS.saveProfile(uid, { weight: parseFloat(weight) });
    showToast('Weight logged!');
    setWeight('');
    reloadWeights();
  };
  return (
    <div className="card fade-in" style={{background:'linear-gradient(135deg,rgba(108,92,231,0.15),rgba(0,206,201,0.1))',borderColor:'var(--primary)'}}>
      <div style={{display:'flex',alignItems:'center',gap:12}}>
        <span className="material-icons-round" style={{color:'var(--primary-light)',fontSize:28}}>monitor_weight</span>
        <div style={{flex:1}}><p style={{fontSize:13,fontWeight:600}}>Log today's weight</p><p style={{fontSize:11,color:'var(--text3)'}}>Weigh yourself before eating</p></div>
      </div>
      <div style={{display:'flex',gap:8,marginTop:12}}>
        <input type="number" step="0.1" value={weight} onChange={e=>setWeight(e.target.value)} placeholder="Weight in kg" style={{flex:1,padding:'10px 14px',background:'var(--bg)',border:'1px solid var(--border)',borderRadius:10,color:'var(--text)',fontSize:15,outline:'none'}} />
        <button className="btn btn-primary btn-sm" onClick={save}>Log</button>
      </div>
    </div>
  );
}

// ==================== LOG MEAL PAGE ====================
function LogMealPage({ user, uid, foods, showToast, setPage, reloadMeals }) {
  const [mode, setMode] = useState(null);
  const [items, setItems] = useState([]);
  const [mealLabel, setMealLabel] = useState('');
  const [searchQ, setSearchQ] = useState('');
  const [searchCat, setSearchCat] = useState('All');
  const [analyzing, setAnalyzing] = useState(false);
  const fileRef = useRef();
  const cameraRef = useRef();

  const categories = ['All', ...new Set(foods.map(f=>f.category))];
  const filteredFoods = useMemo(() => {
    let f = foods;
    if (searchCat !== 'All') f = f.filter(x=>x.category===searchCat);
    if (searchQ) { const q = searchQ.toLowerCase(); f = f.filter(x=>x.name.toLowerCase().includes(q) || x.category.toLowerCase().includes(q)); }
    return f.slice(0, 100);
  }, [foods, searchQ, searchCat]);

  const handleImage = async (file) => {
    if (!file) return;
    setAnalyzing(true); setMode('analyzing');
    try {
      const formData = new FormData(); formData.append('image', file);
      const res = await fetch('/api/analyze-food', { method:'POST', body: formData });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      setItems(data.items.map(it=>({...it, qty: 1})));
      setMode('review');
    } catch(err) { showToast('Failed to analyze: ' + err.message, 'error'); setMode(null); }
    setAnalyzing(false);
  };

  const addFromSearch = (food) => {
    setItems([...items, { name: food.name, quantity: food.serving, calories: food.calories, protein: food.protein, carbs: food.carbs, fat: food.fat, fiber: food.fiber||0, qty: 1 }]);
    showToast(`Added ${food.name}`);
  };

  const removeItem = (idx) => setItems(items.filter((_,i)=>i!==idx));
  const updateQty = (idx, delta) => { const n = [...items]; n[idx].qty = Math.max(0.5, (n[idx].qty||1) + delta); setItems(n); };

  const saveMeal = async () => {
    if (items.length === 0) { showToast('Add some items first','error'); return; }
    const date = todayStr();
    const existing = user.meals[date] || [];
    const newMeals = [...existing, {
      label: mealLabel || `Meal ${existing.length+1}`,
      time: new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),
      items: items,
    }];
    await FS.saveMeals(uid, date, newMeals);
    showToast('Meal logged!');
    setItems([]); setMode(null); setMealLabel('');
    await reloadMeals();
    setPage('dashboard');
  };

  const totalCal = items.reduce((a,i)=>a+i.calories*i.qty, 0);

  return (
    <div className="container">
      <div className="header fade-in"><h1>Log Meal</h1></div>
      {!mode && (
        <div className="fade-in">
          <div className="input-group"><label>Meal Name (optional)</label><input value={mealLabel} onChange={e=>setMealLabel(e.target.value)} placeholder="e.g. Breakfast, Lunch, Dinner..." /></div>
          <div className="camera-options">
            <div className="camera-option" onClick={()=>cameraRef.current?.click()}>
              <span className="material-icons-round">photo_camera</span><p>Take Photo</p>
              <input ref={cameraRef} type="file" accept="image/*" capture="environment" className="file-input" onChange={e=>handleImage(e.target.files[0])} />
            </div>
            <div className="camera-option" onClick={()=>fileRef.current?.click()}>
              <span className="material-icons-round">photo_library</span><p>Upload Image</p>
              <input ref={fileRef} type="file" accept="image/*" className="file-input" onChange={e=>handleImage(e.target.files[0])} />
            </div>
          </div>
          <div style={{textAlign:'center',margin:'12px 0',color:'var(--text3)',fontSize:13}}>or</div>
          <button className="btn btn-ghost btn-full" onClick={()=>setMode('search')}><span className="material-icons-round">search</span> Search Food Database</button>
          {items.length > 0 && <ItemsReview items={items} updateQty={updateQty} removeItem={removeItem} totalCal={totalCal} onAddMore={()=>setMode('search')} onSave={saveMeal} />}
        </div>
      )}

// ==================== WEIGHT TRACKER ====================
function WeightPage({ user, uid, showToast, reloadWeights, reloadProfile }) {
  const [weight, setWeight] = useState('');
  const [showAnalysis, setShowAnalysis] = useState(false);
  const [analysis, setAnalysis] = useState('');
  const [analyzing, setAnalyzing] = useState(false);
  const chartRef = useRef();
  const chartInstance = useRef();

  const weights = user.weights || {};
  const sortedDates = Object.keys(weights).sort();
  const p = user.profile;
  const currentWeight = getLatestWeight(user);
  const bmr = calcBMR(currentWeight, p.height, p.age, p.gender);
  const tdee = bmr * p.activityFactor;
  const dailyDeficit = (p.targetLossPerWeek * 7700) / 7;
  const budget = Math.round(tdee - dailyDeficit);
  const startWeight = p.startWeight || currentWeight;
  const startDate = p.startDate || sortedDates[0] || todayStr();
  const daysSinceStart = Math.floor((new Date(todayStr()) - new Date(startDate)) / 86400000);
  const estimatedWeight = startWeight - (p.targetLossPerWeek / 7) * daysSinceStart;
  const weightDiff = currentWeight - estimatedWeight;

  const logWeight = async () => {
    if (!weight) return;
    await FS.saveWeight(uid, todayStr(), parseFloat(weight));
    await FS.saveProfile(uid, { weight: parseFloat(weight) });
    showToast('Weight updated!');
    setWeight('');
    reloadWeights();
    reloadProfile();
  };

  const doAIAnalysis = async () => {
    setAnalyzing(true); setShowAnalysis(true);
    try {
      const weightData = sortedDates.map(d=>({date:d,weight:weights[d]}));
      const mealData = [];
      const meals = user.meals || {};
      Object.keys(meals).sort().slice(-21).forEach(d => { meals[d].forEach(m => { mealData.push({ date:d, label:m.label, totalCal: m.items.reduce((a,i)=>a+i.calories*i.qty,0), items: m.items.map(i=>i.name).join(', ') }); }); });
      const res = await fetch('/api/ai-analysis', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ weightData, mealData, profile:p, tdee:Math.round(tdee), dailyBudget:budget }) });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      setAnalysis(data.analysis);
    } catch(err) { setAnalysis('Failed: ' + err.message); }
    setAnalyzing(false);
  };

  useEffect(() => {
    if (!chartRef.current || sortedDates.length < 2) return;
    if (chartInstance.current) chartInstance.current.destroy();
    const estimatedData = sortedDates.map(d => { const days = Math.floor((new Date(d) - new Date(startDate)) / 86400000); return startWeight - (p.targetLossPerWeek / 7) * days; });
    chartInstance.current = new Chart(chartRef.current, {
      type: 'line',
      data: {
        labels: sortedDates.map(d => new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'})),
        datasets: [
          { label:'Actual Weight', data:sortedDates.map(d=>weights[d]), borderColor:'#6c5ce7', backgroundColor:'rgba(108,92,231,0.1)', fill:true, tension:0.4, pointRadius:4, pointBackgroundColor:'#6c5ce7', borderWidth:2 },
          { label:'Estimated Weight', data:estimatedData, borderColor:'#00cec9', borderDash:[5,5], tension:0.4, pointRadius:0, borderWidth:2 }
        ]
      },
      options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{color:'#b2b2cc',font:{size:11}}}}, scales:{x:{ticks:{color:'#6c6c8a',font:{size:10},maxRotation:45},grid:{color:'rgba(255,255,255,0.05)'}},y:{ticks:{color:'#6c6c8a',font:{size:11}},grid:{color:'rgba(255,255,255,0.05)'}}} }
    });
    return () => { if(chartInstance.current) chartInstance.current.destroy(); };
  }, [sortedDates.length, weights]);

  return (
    <div className="container">
      <div className="header fade-in"><h1>Weight Tracker</h1></div>
      <div className="card fade-in">
        <div style={{display:'flex',justifyContent:'space-around',textAlign:'center'}}>
          <div><div style={{fontSize:28,fontWeight:900,color:'var(--primary-light)'}}>{currentWeight}</div><div style={{fontSize:11,color:'var(--text3)'}}>Current (kg)</div></div>
          <div style={{width:1,background:'var(--border)'}}></div>
          <div><div style={{fontSize:28,fontWeight:900,color:'var(--accent)'}}>{estimatedWeight.toFixed(1)}</div><div style={{fontSize:11,color:'var(--text3)'}}>Target (kg)</div></div>
          <div style={{width:1,background:'var(--border)'}}></div>
          <div><div style={{fontSize:28,fontWeight:900,color:weightDiff>0.5?'var(--red)':'var(--green)'}}>{weightDiff>0?'+':''}{weightDiff.toFixed(1)}</div><div style={{fontSize:11,color:'var(--text3)'}}>Diff (kg)</div></div>
        </div>
        {weightDiff > 0.5 && <div style={{marginTop:12,padding:8,borderRadius:8,background:'rgba(255,107,107,0.1)',textAlign:'center'}}><span className="badge badge-orange">External Variables Likely</span></div>}
      </div>
      <div className="card fade-in" style={{animationDelay:'0.1s'}}>
        <h3 style={{fontSize:14,marginBottom:12}}>Log Weight</h3>
        <div style={{display:'flex',gap:8}}>
          <input type="number" step="0.1" value={weight} onChange={e=>setWeight(e.target.value)} placeholder="Today's weight (kg)" style={{flex:1,padding:'10px 14px',background:'var(--bg)',border:'1px solid var(--border)',borderRadius:10,color:'var(--text)',fontSize:15,outline:'none'}} />
          <button className="btn btn-primary btn-sm" onClick={logWeight}>Log</button>
        </div>
      </div>
      <div className="card fade-in" style={{animationDelay:'0.15s'}}>
        <h3 style={{fontSize:14,marginBottom:8}}>Progress</h3>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--text3)'}}><span>Start: {startWeight}kg</span><span>Lost: {(startWeight - currentWeight).toFixed(1)}kg</span></div>
        <div className="progress-bar"><div className="progress-bar-fill" style={{width:`${Math.min(100,Math.max(0,((startWeight-currentWeight)/Math.max(1,startWeight-estimatedWeight))*100))}%`,background:'var(--gradient1)'}}></div></div>
        <p style={{fontSize:11,color:'var(--text3)',textAlign:'center'}}>Goal: lose {p.targetLossPerWeek}kg/week | Budget: {budget} cal/day</p>
      </div>
      {sortedDates.length >= 2 && <div className="card fade-in" style={{animationDelay:'0.2s'}}><h3 style={{fontSize:14,marginBottom:8}}>Weight History</h3><div className="chart-container"><canvas ref={chartRef}></canvas></div></div>}
      <button className="btn btn-primary btn-full fade-in" style={{animationDelay:'0.3s',marginBottom:16}} onClick={doAIAnalysis}><span className="material-icons-round">auto_awesome</span> AI Analysis</button>
      {showAnalysis && <div className="modal-overlay" onClick={()=>setShowAnalysis(false)}><div className="modal" onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <h2 style={{margin:0}}>AI Analysis</h2>
          <button onClick={()=>setShowAnalysis(false)} style={{background:'var(--bg3)',border:'none',borderRadius:50,width:32,height:32,color:'var(--text)',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><span className="material-icons-round" style={{fontSize:18}}>close</span></button>
        </div>
        {analyzing ? <div className="spinner"></div> : <div className="analysis-text">{analysis}</div>}
      </div></div>}
    </div>
  );
}

function CalendarPage({ user, uid, foods, showToast }) {
  const [currentMonth, setCurrentMonth] = useState(new Date());
  const [selectedDate, setSelectedDate] = useState(null);
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthName = currentMonth.toLocaleDateString('en-IN',{month:'long',year:'numeric'});
  const meals = user.meals || {};
  const p = user.profile;
  const days = []; for(let i=0;i<firstDay;i++) days.push(null); for(let d=1;d<=daysInMonth;d++) days.push(d);
  const getDateStr = (d) => `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const getDayCals = (d) => { const dayMeals = meals[getDateStr(d)] || []; return dayMeals.reduce((s,m)=>s+m.items.reduce((a,i)=>a+i.calories*i.qty,0),0); };
  const currentW = getLatestWeight(user);
  const bmr2 = calcBMR(currentW, p.height, p.age, p.gender);
  const budget2 = Math.round(bmr2 * p.activityFactor - (p.targetLossPerWeek*7700/7));

  return (
    <div className="container">
      <div className="header fade-in"><h1>Calendar</h1></div>
      <div className="card fade-in">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>setCurrentMonth(new Date(year,month-1,1))}><span className="material-icons-round">chevron_left</span></button>
          <h3 style={{fontSize:16}}>{monthName}</h3>
          <button className="btn btn-ghost btn-sm" onClick={()=>setCurrentMonth(new Date(year,month+1,1))}><span className="material-icons-round">chevron_right</span></button>
        </div>
        <div className="calendar-grid">
          {['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=><div key={d} className="cal-header">{d}</div>)}
          {days.map((d,i) => {
            if (!d) return <div key={i} className="cal-day empty"></div>;
            const dateStr = getDateStr(d);
            const cals = getDayCals(d);
            const hasData = cals > 0;
            return <div key={i} className={`cal-day ${dateStr===todayStr()?'today':''} ${hasData?'has-data':''} ${cals>budget2?'over-budget':''}`} onClick={()=>hasData && setSelectedDate(dateStr)}>{d}</div>;
          })}
        </div>
      </div>
      {selectedDate && <div className="modal-overlay" onClick={()=>setSelectedDate(null)}><div className="modal" onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <h2 style={{margin:0}}>{formatDate(selectedDate)}</h2>
          <button onClick={()=>setSelectedDate(null)} style={{background:'var(--bg3)',border:'none',borderRadius:50,width:32,height:32,color:'var(--text)',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><span className="material-icons-round" style={{fontSize:18}}>close</span></button>
        </div>
        {user.weights && user.weights[selectedDate] && <p style={{fontSize:13,color:'var(--text3)',marginBottom:12}}>Weight: {user.weights[selectedDate]}kg</p>}
        {(meals[selectedDate]||[]).map((meal,i)=>(
          <div key={i} className="meal-card">
            <div className="meal-card-header"><h3>{meal.label} <span style={{fontSize:11,color:'var(--text3)',fontWeight:400}}>{meal.time}</span></h3><span style={{fontWeight:700,color:'var(--accent)'}}>{meal.items.reduce((a,it)=>a+it.calories*it.qty,0)} cal</span></div>
            {meal.items.map((it,j)=><div key={j} className="meal-item-row"><span>{it.name} {it.qty>1?`x${it.qty}`:''}</span><span style={{color:'var(--text3)'}}>{Math.round(it.calories*it.qty)} cal</span></div>)}
          </div>
        ))}
        <div style={{marginTop:12,textAlign:'center'}}><span style={{color:'var(--text3)',fontSize:13}}>Total: </span><span style={{fontSize:20,fontWeight:700,color:'var(--accent)'}}>{(meals[selectedDate]||[]).reduce((s,m)=>s+m.items.reduce((a,i)=>a+i.calories*i.qty,0),0)} cal</span></div>
      </div></div>}
    </div>
  );
}

// ==================== MEAL DETAIL MODAL ====================
function MealDetailModal({ user, uid, date, mealIndex, foods, showToast, onClose }) {
  const meal = user.meals[date][mealIndex];
  const [items, setItems] = useState(meal.items.map(i=>({...i})));
  const updateQty = (idx, delta) => { const n = [...items]; n[idx].qty = Math.max(0.5, n[idx].qty + delta); setItems(n); };
  const removeItem = (idx) => setItems(items.filter((_,i)=>i!==idx));

  const save = async () => {
    const allMeals = [...(user.meals[date] || [])];
    allMeals[mealIndex] = { ...allMeals[mealIndex], items };
    await FS.saveMeals(uid, date, allMeals);
    showToast('Meal updated!');
    onClose();
  };

  const deleteMeal = async () => {
    const allMeals = [...(user.meals[date] || [])];
    allMeals.splice(mealIndex, 1);
    await FS.saveMeals(uid, date, allMeals);
    showToast('Meal deleted');
    onClose();
  };

  return (
    <div className="modal-overlay" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <h2 style={{margin:0}}>{meal.label}</h2>
        <button onClick={onClose} style={{background:'var(--bg3)',border:'none',borderRadius:50,width:32,height:32,color:'var(--text)',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><span className="material-icons-round" style={{fontSize:18}}>close</span></button>
      </div>
      {items.map((it,i)=>(
        <div key={i} className="meal-card">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div><div style={{fontWeight:600,fontSize:14}}>{it.name}</div><div style={{fontSize:11,color:'var(--text3)'}}>P:{Math.round((it.protein||0)*it.qty)}g C:{Math.round((it.carbs||0)*it.qty)}g F:{Math.round((it.fat||0)*it.qty)}g</div></div>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <div className="qty-editor"><button className="qty-btn" onClick={()=>updateQty(i,-0.5)}>-</button><span style={{fontWeight:600,minWidth:24,textAlign:'center'}}>{it.qty}</span><button className="qty-btn" onClick={()=>updateQty(i,0.5)}>+</button></div>
              <span style={{fontWeight:700,color:'var(--accent)'}}>{Math.round(it.calories*it.qty)}</span>
              <button onClick={()=>removeItem(i)} style={{background:'none',border:'none',color:'var(--red)',cursor:'pointer'}}><span className="material-icons-round" style={{fontSize:18}}>close</span></button>
            </div>
          </div>
        </div>
      ))}
      <div style={{textAlign:'center',margin:'12px 0'}}><span style={{color:'var(--text3)',fontSize:13}}>Total: </span><span style={{fontSize:20,fontWeight:700,color:'var(--accent)'}}>{Math.round(items.reduce((a,i)=>a+i.calories*i.qty,0))} cal</span></div>
      <div style={{display:'flex',gap:8}}>
        <button className="btn btn-danger btn-sm" onClick={deleteMeal}><span className="material-icons-round" style={{fontSize:16}}>delete</span> Delete</button>
        <button className="btn btn-primary btn-full" onClick={save}><span className="material-icons-round" style={{fontSize:16}}>save</span> Save Changes</button>
      </div>
    </div></div>
  );
}

function BottomNav({ page, setPage }) {
  const items = [{id:'dashboard',icon:'home',label:'Home'},{id:'log',icon:'add_circle',label:'Log Meal'},{id:'weight',icon:'monitor_weight',label:'Weight'},{id:'calendar',icon:'calendar_month',label:'Calendar'},{id:'settings',icon:'settings',label:'Settings'}];
  return <nav className="bottom-nav">{items.map(it=><button key={it.id} className={`nav-item ${page===it.id?'active':''}`} onClick={()=>setPage(it.id)}><span className="material-icons-round">{it.icon}</span>{it.label}</button>)}</nav>;
}

function getLatestWeight(user) {
  const weights = user.weights || {};
  const dates = Object.keys(weights).sort();
  if (dates.length === 0) return user.profile.weight || 70;
  return weights[dates[dates.length-1]];
}
