    return true;
  };

  return (
    <div className="container">
      <div className="header fade-in"><div><h1><span style={{color:'#fff',WebkitTextFillColor:'#fff'}}>Cal</span><span style={{background:'linear-gradient(135deg,#00cec9,#6c5ce7,#a29bfe)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>Track</span></h1><p style={{fontSize:12,color:'var(--text3)'}}>Calendar</p></div>{profileBtn}</div>

      {/* Filter Chips */}
      <div className="filter-bar fade-in">
        <button className={`filter-chip ${filter==='all'?'active':''}`} onClick={()=>setFilter('all')}>All</button>
        <button className={`filter-chip ${filter==='under'?'active':''}`} onClick={()=>setFilter('under')}><span className="filter-dot" style={{background:'#34d399'}}></span> Under ({underDays})</button>
        <button className={`filter-chip ${filter==='over'?'active':''}`} onClick={()=>setFilter('over')}><span className="filter-dot" style={{background:'#ef4444'}}></span> Over ({overDays})</button>
        <button className={`filter-chip ${filter==='empty'?'active':''}`} onClick={()=>setFilter('empty')}>No Data</button>
      </div>

      <div className="card fade-in">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>setCurrentMonth(new Date(year,month-1,1))}><span className="material-icons-round">chevron_left</span></button>
          <div style={{textAlign:'center'}}>
            <h3 style={{fontSize:16}}>{monthName}</h3>
            <span style={{fontSize:11,color:'var(--text3)'}}>{loggedDays} days logged</span>
          </div>
          <button className="btn btn-ghost btn-sm" onClick={()=>setCurrentMonth(new Date(year,month+1,1))}><span className="material-icons-round">chevron_right</span></button>
        </div>
        <div className="calendar-grid">
          {['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=><div key={d} className="cal-header">{d}</div>)}
          {days.map((d,i) => {
            if (!d) return <div key={i} className="cal-day empty"></div>;
            const dateStr = getDateStr(d);
            const cals = getDayCals(d);
            const hasData = cals > 0;
            const dimmed = !shouldShow(d);
            return <div key={i} className={`cal-day ${dateStr===todayStr()?'today':''} ${hasData?'has-data':''} ${cals>budget2?'over-budget':''} ${selectedDate===dateStr?'selected':''}`} style={dimmed?{opacity:0.15}:{}} onClick={()=>hasData && setSelectedDate(selectedDate===dateStr?null:dateStr)}>{d}</div>;
          })}
        </div>
      </div>

      {/* Day details — inline below calendar */}
      {selectedDate && (meals[selectedDate]||[]).length > 0 && (
        <div className="card fade-in" style={{marginTop:0}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
            <div>
              <h3 style={{fontSize:15,fontWeight:700,margin:0}}>{formatDate(selectedDate)}</h3>
              {user.weights && user.weights[selectedDate] && <span style={{fontSize:12,color:'var(--text3)'}}>{user.weights[selectedDate]} kg</span>}
            </div>
            <div style={{textAlign:'right'}}>
              <span style={{fontSize:18,fontWeight:800,color:'var(--accent)'}}>{(meals[selectedDate]||[]).reduce((s,m)=>s+m.items.reduce((a,i)=>a+i.calories*i.qty,0),0)}</span>
              <span style={{fontSize:11,color:'var(--text3)'}}> / {budget2} cal</span>
            </div>
          </div>
          {(meals[selectedDate]||[]).map((meal,i)=>{
            const mealCal = meal.items.reduce((a,it)=>a+it.calories*it.qty,0);
            return (
              <div key={i} style={{marginBottom:12,padding:'10px 12px',background:'rgba(255,255,255,0.02)',borderRadius:12,border:'1px solid rgba(255,255,255,0.04)'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                  <div style={{fontWeight:700,fontSize:14}}>{meal.label} <span style={{fontSize:11,color:'var(--text3)',fontWeight:400}}>{meal.time}</span></div>
                  <span style={{fontWeight:800,color:'var(--accent)',fontSize:14}}>{mealCal} cal</span>
                </div>
                {meal.items.map((it,j)=>(
                  <div key={j} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'5px 0',borderTop: j===0 ? '1px solid rgba(255,255,255,0.04)' : 'none'}}>
                    <div>
                      <span style={{fontSize:13,color:'var(--text)'}}>{it.name}</span>
                      {it.qty > 1 && <span style={{fontSize:11,color:'var(--text3)',marginLeft:4}}>x{it.qty}</span>}
                      <div style={{fontSize:11,color:'var(--text3)'}}>P:{Math.round((it.protein||0)*it.qty)}g  C:{Math.round((it.carbs||0)*it.qty)}g  F:{Math.round((it.fat||0)*it.qty)}g</div>
                    </div>
                    <span style={{fontSize:13,color:'var(--text2)',fontWeight:600}}>{Math.round(it.calories*it.qty)}</span>
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ==================== SETTINGS PAGE ====================
function SettingsPage({ user, uid, showToast, onLogout, reloadProfile, setPage }) {
  const p = user.profile;
  const latestWeight = getLatestWeight(user);
  const [form, setForm] = useState({ height:p.height, weight:latestWeight, age:p.age, gender:p.gender, activityFactor:p.activityFactor, targetLossPerWeek:p.targetLossPerWeek });
  const set = (k,v) => setForm({...form,[k]:v});

  const save = async () => {
    await FS.saveProfile(uid, {
      height:parseFloat(form.height), weight:parseFloat(form.weight), age:parseInt(form.age), gender:form.gender,
      activityFactor:parseFloat(form.activityFactor), targetLossPerWeek:parseFloat(form.targetLossPerWeek)
    });
    showToast('Settings saved!');
    reloadProfile();
  };

  const bmr = calcBMR(latestWeight,parseFloat(form.height),parseInt(form.age),form.gender);
  const tdee = bmr * parseFloat(form.activityFactor);
  const budget = Math.round(tdee - (parseFloat(form.targetLossPerWeek)*7700/7));
  const deficit = Math.round(parseFloat(form.targetLossPerWeek)*7700/7);

  return (
    <div className="container">
      <div className="header fade-in">
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>setPage('dashboard')}><span className="material-icons-round">arrow_back</span></button>
          <h1>Profile Settings</h1>
        </div>
      </div>

      {/* Profile Card */}
      <div className="card fade-in" style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
        <div className="avatar" style={{width:48,height:48,fontSize:20}}>
          {user.name[0].toUpperCase()}
        </div>
        <div style={{flex:1}}>
          <div style={{fontWeight:600}}>{user.name}</div>
          <div style={{fontSize:12,color:'var(--text3)'}}>@{uid}</div>
        </div>
        <span className="chip chip-success">Active</span>
      </div>

      {/* Inspector: Body */}
      <div className="inspector-card fade-in">
        <div className="inspector-header">
          <span className="material-icons-round" style={{fontSize:16,color:'var(--accent)'}}>person</span>
          Body
        </div>
        <div className="inspector-row">
          <span className="inspector-label">Gender</span>
          <select className="inspector-value" value={form.gender} onChange={e=>set('gender',e.target.value)} style={{background:'transparent',border:'none',color:'var(--text)',textAlign:'right',fontSize:13}}><option value="male">Male</option><option value="female">Female</option></select>
        </div>
        <div className="inspector-row">
          <span className="inspector-label">Age</span>
          <input className="inspector-value" type="number" value={form.age} onChange={e=>set('age',e.target.value)} style={{background:'transparent',border:'none',color:'var(--text)',textAlign:'right',width:60,fontSize:13}} />
        </div>
        <div className="inspector-row">
          <span className="inspector-label">Height</span>
          <div style={{display:'flex',alignItems:'center',gap:4}}>
            <input className="inspector-value" type="number" value={form.height} onChange={e=>set('height',e.target.value)} style={{background:'transparent',border:'none',color:'var(--text)',textAlign:'right',width:50,fontSize:13}} />
            <span style={{fontSize:11,color:'var(--text3)'}}>cm</span>
          </div>
        </div>
        <div className="inspector-row">
          <span className="inspector-label">Weight</span>
          <div style={{display:'flex',alignItems:'center',gap:4}}>
            <input className="inspector-value" type="number" step="0.1" value={form.weight} onChange={e=>set('weight',e.target.value)} style={{background:'transparent',border:'none',color:'var(--text)',textAlign:'right',width:50,fontSize:13}} />
            <span style={{fontSize:11,color:'var(--text3)'}}>kg</span>
          </div>
        </div>
      </div>

      {/* Inspector: Goals */}
      <div className="inspector-card fade-in" style={{animationDelay:'0.1s'}}>
        <div className="inspector-header">
          <span className="material-icons-round" style={{fontSize:16,color:'var(--accent)'}}>flag</span>
          Goals
        </div>
        <div className="inspector-row">
          <span className="inspector-label">Activity <ActivityInfoBtn /></span>
          <select className="inspector-value" value={form.activityFactor} onChange={e=>set('activityFactor',e.target.value)} style={{background:'transparent',border:'none',color:'var(--text)',textAlign:'right',fontSize:12,maxWidth:140}}>{ACTIVITY_FACTORS.map(a=><option key={a.value} value={a.value}>{a.label}</option>)}</select>
        </div>
        <div className="inspector-row">
          <span className="inspector-label">Weekly Loss</span>
          <select className="inspector-value" value={form.targetLossPerWeek} onChange={e=>set('targetLossPerWeek',e.target.value)} style={{background:'transparent',border:'none',color:'var(--text)',textAlign:'right',fontSize:13}}>{[0.25,0.5,0.75,1,1.25,1.5,2,2.5,3].map(v=><option key={v} value={v}>{v} kg</option>)}</select>
        </div>
      </div>

      {/* Computed Stats Card */}
      <div className="inspector-card fade-in" style={{animationDelay:'0.15s'}}>
        <div className="inspector-header">
          <span className="material-icons-round" style={{fontSize:16,color:'var(--accent)'}}>analytics</span>
          Computed
        </div>
        <div className="inspector-row">
          <span className="inspector-label">BMR</span>
          <span style={{fontWeight:600,fontSize:13}}>{Math.round(bmr)} cal</span>
        </div>
        <div className="inspector-row">
          <span className="inspector-label">TDEE</span>
          <span style={{fontWeight:600,fontSize:13}}>{Math.round(tdee)} cal</span>
        </div>
        <div className="inspector-row">
          <span className="inspector-label">Deficit</span>
          <span className="chip chip-warning" style={{fontSize:11}}>{deficit} cal/day</span>
        </div>
        <div className="inspector-row" style={{borderBottom:'none'}}>
          <span className="inspector-label" style={{fontWeight:600}}>Daily Budget</span>
          <span style={{fontWeight:800,fontSize:16,color:'var(--accent)'}}>{budget} cal</span>
        </div>
      </div>

      <button className="btn btn-primary btn-full fade-in" style={{animationDelay:'0.2s',marginBottom:12}} onClick={save}><span className="material-icons-round">save</span> Save Settings</button>
    </div>
  );
}

// ==================== MEAL DETAIL MODAL ====================
function MealDetailModal({ user, uid, date, mealIndex, foods, showToast, onClose }) {
  const meal = user.meals[date][mealIndex];
  const [items, setItems] = useState(meal.items.map(i=>({...i})));
  const updateQty = (idx, delta) => { const n = [...items]; n[idx].qty = Math.max(0.5, n[idx].qty + delta); setItems(n); };
  const removeItem = (idx) => setItems(items.filter((_,i)=>i!==idx));

  const save = async () => {
    const allMeals = [...(user.meals[date] || [])];
    allMeals[mealIndex] = { ...allMeals[mealIndex], items };
    await FS.saveMeals(uid, date, allMeals);
    showToast('Meal updated!');
    onClose();
  };

  const deleteMeal = async () => {
    const allMeals = [...(user.meals[date] || [])];
    allMeals.splice(mealIndex, 1);
    await FS.saveMeals(uid, date, allMeals);
    showToast('Meal deleted');
    onClose();
  };

  return (
    <div className="modal-overlay" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <h2 style={{margin:0}}>{meal.label}</h2>
        <button onClick={onClose} style={{background:'var(--bg3)',border:'none',borderRadius:50,width:32,height:32,color:'var(--text)',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><span className="material-icons-round" style={{fontSize:18}}>close</span></button>
      </div>
      {items.map((it,i)=>(
        <div key={i} className="meal-card">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div><div style={{fontWeight:600,fontSize:14}}>{it.name}</div><div style={{fontSize:11,color:'var(--text3)'}}>P:{Math.round((it.protein||0)*it.qty)}g C:{Math.round((it.carbs||0)*it.qty)}g F:{Math.round((it.fat||0)*it.qty)}g</div></div>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <div className="qty-editor"><button className="qty-btn" onClick={()=>updateQty(i,-0.5)}>-</button><span style={{fontWeight:600,minWidth:24,textAlign:'center'}}>{it.qty}</span><button className="qty-btn" onClick={()=>updateQty(i,0.5)}>+</button></div>
              <span style={{fontWeight:700,color:'var(--accent)'}}>{Math.round(it.calories*it.qty)}</span>
              <button onClick={()=>removeItem(i)} style={{background:'none',border:'none',color:'var(--red)',cursor:'pointer'}}><span className="material-icons-round" style={{fontSize:18}}>close</span></button>
            </div>
          </div>
        </div>
      ))}
      <div style={{textAlign:'center',margin:'12px 0'}}><span style={{color:'var(--text3)',fontSize:13}}>Total: </span><span style={{fontSize:20,fontWeight:700,color:'var(--accent)'}}>{Math.round(items.reduce((a,i)=>a+i.calories*i.qty,0))} cal</span></div>
      <div style={{display:'flex',gap:8}}>
        <button className="btn btn-danger btn-sm" onClick={deleteMeal}><span className="material-icons-round" style={{fontSize:16}}>delete</span> Delete</button>
        <button className="btn btn-primary btn-full" onClick={save}><span className="material-icons-round" style={{fontSize:16}}>save</span> Save Changes</button>
      </div>
    </div></div>
  );
}

// ==================== FRIENDS PAGE ====================
function FriendsPage({ uid, user, showToast, profileBtn }) {
  const [tab, setTab] = useState('friends'); // friends | add
  const [searchUser, setSearchUser] = useState('');
  const [sending, setSending] = useState(false);
  const [sendCooldown, setSendCooldown] = useState(0);
  const [friends, setFriends] = useState([]);
  const [incoming, setIncoming] = useState([]);
  const [outgoing, setOutgoing] = useState([]);
  const [friendNames, setFriendNames] = useState({});
  const [viewingFriend, setViewingFriend] = useState(null);
  const [friendData, setFriendData] = useState(null);
  const [loadingFriend, setLoadingFriend] = useState(false);

  const loadAll = async () => {
    const f = await FS.getFriends(uid);
    setFriends(f);
    // Load friend display names
    const names = {};
    for (const fid of f) {
      const p = await FS.getProfile(fid);
      names[fid] = p?.name || fid;
    }
    setFriendNames(names);
    setIncoming(await FS.getIncomingRequests(uid));
    setOutgoing(await FS.getOutgoingRequests(uid));
  };

  useEffect(() => { loadAll(); }, []);

  // Cooldown timer
  useEffect(() => {
    if (sendCooldown <= 0) return;
    const t = setTimeout(() => setSendCooldown(sendCooldown - 1), 1000);
    return () => clearTimeout(t);
  }, [sendCooldown]);

  const sendRequest = async () => {
    if (!searchUser.trim() || sending || sendCooldown > 0) return;
    setSending(true);
    const result = await FS.sendFriendRequest(uid, searchUser.toLowerCase().trim());
    setSending(false);
    if (result.error) { showToast(result.error, 'error'); }
    else { showToast('Friend request sent!'); setSearchUser(''); setSendCooldown(10); loadAll(); }
  };

  const accept = async (req) => {
    await FS.acceptFriendRequest(req.id, req.from, req.to);
    showToast(`${req.from} is now your friend!`);
    loadAll();
  };

  const reject = async (req) => {
    await FS.rejectFriendRequest(req.id);
    showToast('Request declined');
    loadAll();
  };

  const viewFriend = async (fid) => {
    setViewingFriend(fid);
    setLoadingFriend(true);
    const data = await FS.getFriendData(fid);
    setFriendData(data);
    setLoadingFriend(false);
  };

  // Friend progress view
  if (viewingFriend && friendData) {
    return <FriendProgressView
      friendUid={viewingFriend}
      friendData={friendData}
      friendName={friendNames[viewingFriend] || viewingFriend}
      onBack={() => { setViewingFriend(null); setFriendData(null); }}
    />;
  }

  return (
    <div className="container">
      <div className="header fade-in"><div><h1><span style={{color:'#fff',WebkitTextFillColor:'#fff'}}>Cal</span><span style={{background:'linear-gradient(135deg,#00cec9,#6c5ce7,#a29bfe)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>Track</span></h1><p style={{fontSize:12,color:'var(--text3)'}}>Friends</p></div>{profileBtn}</div>

      {/* Tabs */}
      <div style={{display:'flex',gap:8,marginBottom:16}} className="fade-in">
        <button className={`filter-chip ${tab==='friends'?'active':''}`} onClick={()=>setTab('friends')}>My Friends ({friends.length})</button>
        <button className={`filter-chip ${tab==='add'?'active':''}`} onClick={()=>setTab('add')}>Add Friend</button>
        {incoming.length > 0 && <button className={`filter-chip ${tab==='requests'?'active':''}`} onClick={()=>setTab('requests')} style={{position:'relative'}}>
          Requests <span style={{background:'var(--red)',color:'#fff',borderRadius:10,padding:'1px 6px',fontSize:10,fontWeight:700,marginLeft:4}}>{incoming.length}</span>
        </button>}
      </div>

      {/* Add Friend */}
      {tab === 'add' && (
        <div className="card fade-in">
          <h3 style={{fontSize:15,fontWeight:700,marginBottom:12}}>Send Friend Request</h3>
          <div style={{display:'flex',gap:8}}>
            <input value={searchUser} onChange={e=>setSearchUser(e.target.value)} placeholder="Enter username..." onKeyDown={e=>e.key==='Enter'&&sendRequest()} style={{flex:1,padding:'10px 14px',background:'var(--bg)',border:'1px solid var(--border)',borderRadius:10,color:'var(--text)',fontSize:14,outline:'none'}} />
            <button className="btn btn-primary btn-sm" onClick={sendRequest} disabled={sending || sendCooldown > 0 || !searchUser.trim()} style={{opacity:(sending||sendCooldown>0||!searchUser.trim())?0.5:1}}>
              {sending ? <span className="spinner" style={{width:16,height:16}}></span> : sendCooldown > 0 ? `${sendCooldown}s` : <span className="material-icons-round" style={{fontSize:18}}>send</span>}
            </button>
          </div>
          {sendCooldown > 0 && <p style={{fontSize:12,color:'var(--text3)',marginTop:8}}>Wait {sendCooldown}s before sending another request</p>}

          {/* Outgoing requests */}
          {outgoing.length > 0 && (
            <div style={{marginTop:16}}>
              <h4 style={{fontSize:12,color:'var(--text3)',textTransform:'uppercase',letterSpacing:0.5,marginBottom:8}}>Pending Sent</h4>
              {outgoing.map(r => (
                <div key={r.id} className="meal-status-row" style={{marginBottom:4}}>
                  <div className="meal-status-info" style={{paddingLeft:4}}>
                    <div className="meal-name">{r.to}</div>
                    <div style={{fontSize:11,color:'var(--text3)'}}>Waiting for response</div>
                  </div>
                  <span className="chip chip-warning" style={{fontSize:10}}>Pending</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {/* Incoming Requests */}
      {tab === 'requests' && (
        <div className="fade-in">
          {incoming.length === 0 && <div className="card" style={{textAlign:'center',padding:32,color:'var(--text3)'}}>No pending requests</div>}
          {incoming.map(req => (
            <div key={req.id} className="card" style={{display:'flex',alignItems:'center',gap:12,marginBottom:8}}>
              <div className="avatar" style={{width:40,height:40,fontSize:16}}>{req.from[0].toUpperCase()}</div>
              <div style={{flex:1}}>
                <div style={{fontWeight:600}}>{req.from}</div>
                <div style={{fontSize:11,color:'var(--text3)'}}>wants to be friends</div>
              </div>
              <div style={{display:'flex',gap:6}}>
                <button className="btn btn-primary btn-sm" onClick={()=>accept(req)} style={{padding:'6px 12px'}}><span className="material-icons-round" style={{fontSize:16}}>check</span></button>
                <button className="btn btn-danger btn-sm" onClick={()=>reject(req)} style={{padding:'6px 12px'}}><span className="material-icons-round" style={{fontSize:16}}>close</span></button>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Friends List */}
      {tab === 'friends' && (
        <div className="fade-in">
          {friends.length === 0 && (
            <div className="card" style={{textAlign:'center',padding:32}}>
              <span className="material-icons-round" style={{fontSize:48,color:'var(--text3)',opacity:0.3}}>people</span>
              <p style={{color:'var(--text3)',marginTop:8}}>No friends yet</p>
              <button className="btn btn-primary btn-sm" style={{marginTop:12}} onClick={()=>setTab('add')}>Add a Friend</button>
            </div>
          )}
          {friends.map(fid => (
            <div key={fid} className="meal-status-row" style={{marginBottom:8,cursor:'pointer'}} onClick={()=>viewFriend(fid)}>
              <div className="avatar" style={{width:40,height:40,fontSize:16,flexShrink:0}}>{(friendNames[fid]||fid)[0].toUpperCase()}</div>
              <div className="meal-status-info" style={{paddingLeft:4}}>
                <div className="meal-name">{friendNames[fid] || fid}</div>
                <div style={{fontSize:11,color:'var(--text3)'}}>@{fid}</div>
              </div>
              <span className="material-icons-round" style={{color:'var(--text3)',fontSize:18}}>chevron_right</span>
            </div>
          ))}
        </div>
      )}
      {loadingFriend && <div style={{textAlign:'center',padding:32}}><div className="spinner"></div></div>}
    </div>
  );
}

// ==================== FRIEND PROGRESS VIEW ====================
function FriendProgressView({ friendUid, friendData, friendName, onBack }) {
  const { profile, weights, meals } = friendData;
  if (!profile) return <div className="container"><div className="card" style={{textAlign:'center',padding:32,color:'var(--text3)'}}>Could not load profile</div></div>;

  const today = todayStr();
  const todayMeals = meals[today] || [];
  const consumed = todayMeals.reduce((s,m) => s + m.items.reduce((a,i) => a + i.calories * i.qty, 0), 0);
  const currentWeight = (() => { const d = Object.keys(weights).sort(); return d.length ? weights[d[d.length-1]] : profile.weight || 70; })();
  const bmr = calcBMR(currentWeight, profile.height, profile.age, profile.gender);
  const tdee = bmr * (profile.activityFactor || 1.2);
  const budget = Math.round(tdee - ((profile.targetLossPerWeek || 0.5) * 7700 / 7));
  const remaining = budget - consumed;
  const pct = Math.min(consumed / budget, 1);
  const circumference = 2 * Math.PI * 70;
  const dashOffset = circumference * (1 - pct);
  const ringOver = remaining < 0;

  // Weight chart data — last 30 days
  const sortedDates = Object.keys(weights).sort();
  const last30 = sortedDates.slice(-30);
  const chartRef = useRef(null);
  const chartInstance = useRef(null);

  useEffect(() => {
    if (!chartRef.current || last30.length < 2) return;
    if (chartInstance.current) chartInstance.current.destroy();
    chartInstance.current = new Chart(chartRef.current, {
      type: 'line',
      data: {
        labels: last30.map(d => new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'})),
        datasets: [{
          data: last30.map(d => weights[d]),
          borderColor: '#a29bfe', backgroundColor: 'rgba(162,155,254,0.08)',
          borderWidth: 2, pointRadius: 3, pointBackgroundColor: '#a29bfe',
          fill: true, tension: 0.3
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#6c6c8a', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.03)' } },
          y: { ticks: { color: '#6c6c8a', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.03)' } }
        }
      }
    });
    return () => { if (chartInstance.current) chartInstance.current.destroy(); };
  }, []);

  const weightDiff = profile.targetWeight ? (currentWeight - profile.targetWeight).toFixed(1) : null;
  const progressPct = profile.targetWeight && profile.weight ? Math.min(100, Math.max(0, Math.round(((profile.weight - currentWeight) / (profile.weight - profile.targetWeight)) * 100))) : null;

  return (
    <div className="container">
      <div className="header fade-in">
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <button className="btn btn-ghost btn-sm" onClick={onBack}><span className="material-icons-round">arrow_back</span></button>
          <div>
            <h1 style={{fontSize:20}}>{friendName}</h1>
            <p style={{fontSize:11,color:'var(--text3)'}}>@{friendUid}</p>
          </div>
        </div>
      </div>

      {/* Today's Calories */}
      <div className="card fade-in" style={{background:'linear-gradient(145deg, rgba(30,28,60,0.95), rgba(18,16,40,0.95))', border:'1px solid rgba(108,92,231,0.15)'}}>
        <h3 style={{fontSize:12,color:'var(--text3)',textTransform:'uppercase',letterSpacing:0.5,marginBottom:12}}>Today's Calories</h3>
        <div style={{display:'flex',alignItems:'center',gap:20}}>
          <div style={{position:'relative',width:120,height:120,flexShrink:0}}>
            <svg width="120" height="120" viewBox="0 0 160 160" style={{transform:'rotate(-90deg)'}}>
              <defs>
                <linearGradient id="friendRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  {ringOver
                    ? [<stop key="a" offset="0%" stopColor="#ef4444"/>, <stop key="b" offset="100%" stopColor="#fb7185"/>]
                    : [<stop key="a" offset="0%" stopColor="#00cec9"/>, <stop key="b" offset="50%" stopColor="#6c5ce7"/>, <stop key="c" offset="100%" stopColor="#a29bfe"/>]
                  }
                </linearGradient>
              </defs>
              <circle cx="80" cy="80" r="70" fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth="8" />
              <circle cx="80" cy="80" r="70" fill="none" stroke="url(#friendRingGrad)" strokeWidth="8" strokeDasharray={circumference} strokeDashoffset={dashOffset} strokeLinecap="round" style={{transition:'stroke-dashoffset 1.5s ease'}} />
            </svg>
            <div style={{position:'absolute',top:0,left:0,right:0,bottom:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
              <div style={{fontSize:24,fontWeight:900,background:ringOver?'linear-gradient(135deg,#ef4444,#fb7185)':'linear-gradient(135deg,#00cec9,#a29bfe)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>{Math.round(remaining)}</div>
              <div style={{fontSize:10,color:'var(--text3)'}}>left</div>
            </div>
          </div>
          <div style={{flex:1}}>
            <div style={{marginBottom:8}}><span style={{fontSize:12,color:'var(--text3)'}}>Eaten</span><div style={{fontSize:20,fontWeight:800,color:'var(--accent)'}}>{consumed} cal</div></div>
            <div><span style={{fontSize:12,color:'var(--text3)'}}>Budget</span><div style={{fontSize:16,fontWeight:700,color:'var(--primary-light)'}}>{budget} cal</div></div>
          </div>
        </div>
      </div>

      {/* Weight Goal Progress */}
      {profile.targetWeight && (
        <div className="card fade-in" style={{animationDelay:'0.1s'}}>
          <h3 style={{fontSize:12,color:'var(--text3)',textTransform:'uppercase',letterSpacing:0.5,marginBottom:12}}>Weight Goal</h3>
          <div style={{display:'flex',justifyContent:'space-around',textAlign:'center',marginBottom:12}}>
            <div><div style={{fontSize:22,fontWeight:800,color:'var(--primary-light)'}}>{currentWeight}</div><div style={{fontSize:10,color:'var(--text3)'}}>Current kg</div></div>
            <div style={{display:'flex',alignItems:'center'}}><span className="material-icons-round" style={{color:'var(--text3)',fontSize:20}}>trending_flat</span></div>
            <div><div style={{fontSize:22,fontWeight:800,color:'var(--accent)'}}>{profile.targetWeight}</div><div style={{fontSize:10,color:'var(--text3)'}}>Target kg</div></div>
          </div>
          {progressPct !== null && (
            <div>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--text3)',marginBottom:4}}>
                <span>{progressPct}% there</span>
                <span>{weightDiff > 0 ? weightDiff + ' kg to go' : 'Goal reached!'}</span>
              </div>
              <div style={{height:6,borderRadius:3,background:'rgba(255,255,255,0.06)',overflow:'hidden'}}>
                <div style={{height:'100%',borderRadius:3,width:`${progressPct}%`,background:'linear-gradient(90deg,#6c5ce7,#00cec9)',transition:'width 0.8s ease'}}></div>
              </div>
            </div>
          )}
        </div>
      )}

      {/* Weight Chart */}
      {last30.length >= 2 && (
        <div className="card fade-in" style={{animationDelay:'0.15s'}}>
          <h3 style={{fontSize:12,color:'var(--text3)',textTransform:'uppercase',letterSpacing:0.5,marginBottom:12}}>Weight Trend</h3>
          <div style={{height:180}}><canvas ref={chartRef}></canvas></div>
        </div>
      )}
      {last30.length < 2 && (
        <div className="card fade-in" style={{textAlign:'center',padding:24,color:'var(--text3)'}}>Not enough weight data to show chart</div>
      )}
    </div>
  );
}

// ==================== BOTTOM NAV ====================
function BottomNav({ page, setPage }) {
  const items = [{id:'dashboard',icon:'home',label:'Home'},{id:'log',icon:'add_circle',label:'Log Meal'},{id:'weight',icon:'monitor_weight',label:'Weight'},{id:'calendar',icon:'calendar_month',label:'Calendar'},{id:'friends',icon:'people',label:'Friends'}];
  return (
    <nav className="bottom-nav">
      {items.map(it=><button key={it.id} className={`nav-item ${page===it.id?'active':''}`} onClick={()=>setPage(it.id)}><span className="material-icons-round">{it.icon}</span>{it.label}</button>)}
    </nav>
  );
}

function getLatestWeight(user) {
  const weights = user.weights || {};
  const dates = Object.keys(weights).sort();
  if (dates.length === 0) return user.profile.weight || 70;
  return weights[dates[dates.length-1]];
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(() => {}); }
